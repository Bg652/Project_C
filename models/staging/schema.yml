version: 2

models:

  - name: stg_branches
    columns:
      - name: branch_id
        tests:
          - unique
          - not_null

  - name: stg_customers
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

      - name: email
        tests:
          - not_null

  - name: stg_accounts
    columns:
      - name: account_id
        tests:
          - unique
          - not_null

      - name: customer_id
        tests:
          - not_null

      - name: account_status
        tests:
          - accepted_values:
              arguments:
                values:
                  - ACTIVE
                  - BLOCKED
                  - DORMANT
                  - CLOSED

  - name: stg_transactions
    columns:
      - name: transaction_id
        tests:
          - unique
          - not_null

      - name: account_id
        tests:
          - not_null

      - name: transaction_status
        tests:
          - accepted_values:
              arguments:
                values:
                  - SUCCESS
                  - FAILED
                  - PENDING
                  - REVERSED

  - name: stg_cards
    columns:
      - name: card_id
        tests:
          - unique
          - not_null

      - name: card_status
        tests:
          - accepted_values:
              arguments:
                values:
                  - ACTIVE
                  - BLOCKED
                  - EXPIRED
                  - CLOSED

  - name: stg_loans
    columns:
      - name: loan_id
        tests:
          - unique
          - not_null

      - name: customer_id
        tests:
          - not_null

      - name: loan_status
        tests:
          - accepted_values:
              arguments:
                values:
                  - ACTIVE
                  - CLOSED
                  - DEFAULTED
                  - PENDING

  - name: stg_loan_payments
    columns:
      - name: payment_id
        tests:
          - unique
          - not_null

      - name: loan_id
        tests:
          - not_null

      - name: payment_status
        tests:
          - accepted_values:
              arguments:
                values:
                  - SUCCESS
                  - FAILED
                  - LATE
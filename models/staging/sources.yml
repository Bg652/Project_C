version: 2

sources:

  - name: banksphere
    database: racko-master-project-505113
    schema: banksphere_raw

    tables:

      - name: branches
        identifier: branches

      - name: customers
        identifier: customers

      - name: accounts
        identifier: accounts

        loaded_at_field: updated_at

        freshness:
          warn_after:
            count: 168
            period: hour

          error_after:
            count: 240
            period: hour

      - name: transactions
        identifier: transactions

        loaded_at_field: updated_at

        freshness:
          warn_after:
            count: 168
            period: hour

          error_after:
            count: 240
            period: hour

      - name: cards
        identifier: cards

      - name: loans
        identifier: loans

      - name: loan_payments
        identifier: loan_payments
